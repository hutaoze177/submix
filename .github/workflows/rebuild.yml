name: rebuild
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"     # 北京时间 11:17
    - cron: "17 15 * * *"    # 北京时间 23:17
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml

      - name: Build normal (MATCH -> airport)
        env:
          FRONT: ${{ secrets.FRONT_URL }}
          LAND: ${{ secrets.LAND_URL }}
          DEMOTE: ${{ secrets.DEMOTE_IDS }}
          PIN: ${{ secrets.PIN_LAND }}
        run: |
          mkdir -p out
          python3 submix.py build \
            --front "$FRONT" \
            --land "$LAND" \
            --rules rules/ai-meta.json \
            --pin-land "$PIN" \
            --demote "$DEMOTE" \
            --drop-front "0.1倍率" \
            --dns-fallback \
            -o out/sub.yaml

      - name: Build all-landing variant (MATCH -> landing)
        env:
          FRONT: ${{ secrets.FRONT_URL }}
          LAND: ${{ secrets.LAND_URL }}
          DEMOTE: ${{ secrets.DEMOTE_IDS }}
          PIN: ${{ secrets.PIN_LAND }}
        run: |
          python3 submix.py build \
            --front "$FRONT" \
            --land "$LAND" \
            --rules rules/ai-meta.json \
            --pin-land "$PIN" \
            --demote "$DEMOTE" \
            --drop-front "0.1倍率" \
            --dns-fallback \
            --match "落地-US-ISP" \
            -o out/sub-all-landing.yaml

      - name: Push normal
        env:
          GH_TOKEN: ${{ secrets.SUB_TOKEN }}
        run: python3 submix.py push -f out/sub.yaml --repo hutaoze177/sub --path sub.yaml

      - name: Push all-landing
        env:
          GH_TOKEN: ${{ secrets.SUB_TOKEN }}
        run: python3 submix.py push -f out/sub-all-landing.yaml --repo hutaoze177/sub --path sub-all-landing.yaml
