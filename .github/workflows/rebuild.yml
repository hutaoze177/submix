name: rebuild
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Build
        env:
          FRONT: ${{ secrets.FRONT_URL }}
          LAND: ${{ secrets.LAND_URL }}
          DEMOTE: ${{ secrets.DEMOTE_IDS }}
          PIN: ${{ secrets.PIN_LAND }}
        run: |
          mkdir -p out
          python3 submix.py build \
            --front "$FRONT" \
            --land "$LAND" \
            --rules rules/ai-meta.json \
            --pin-land "$PIN" \
            --split-land --us-prefix "US-" \
            --demote "$DEMOTE" \
            --dns-fallback \
            -o out/sub.yaml
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.SUB_TOKEN }}
        run: python3 submix.py push -f out/sub.yaml --repo hutaoze177/sub --path sub.yaml
